name: Registry OAuth preview

# Short-lived public-origin preview for M2b OAuth, consent and connector testing
# (RFC 002 section 14, ADR 007 section 4, plan task O2).
#
# Stages: plan (target-stack preview for approval) -> create/deploy -> test ->
# evidence -> destroy. Destroy runs after success AND failure, and the hourly
# schedule destroys any preview whose recorded expiry has passed (TTL sweeper,
# feeds O4). The stack is always the dedicated `preview` stack; production data,
# identities and the dormant staging stack are never touched.
#
# Secrets are referenced by name only. The preview-only Secret Manager entries
# (gist-registry-preview-*) and the GitHub environment secrets below must exist
# before the first run; this workflow never creates or prints secret values.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "create = plan, approve, deploy, test, capture evidence, destroy; destroy = tear down now"
        required: true
        type: choice
        options: [create, destroy]
        default: create
      ttl_hours:
        description: Hours until forced teardown (hard maximum 24)
        required: true
        type: number
        default: 6
      keep_after_test:
        description: Keep the preview up after tests (until TTL) for Q6/I6 manual review; destroy still runs on failure
        required: true
        type: boolean
        default: false
      require_protected_resource_metadata:
        description: Fail when the protected-resource metadata document is missing (disable only before I4 lands)
        required: true
        type: boolean
        default: true
  schedule:
    # TTL sweeper: destroy an expired or abandoned preview.
    - cron: "17 * * * *"

# Least privilege: only the jobs that exchange a GitHub OIDC token for cloud
# credentials (plan, create, destroy, ttl-sweep) add id-token: write.
permissions:
  contents: read
  actions: read

# Separate groups per trigger. GitHub keeps only ONE pending run per group, so a
# shared group would let an hourly sweep replace (cancel) a queued manual
# destroy. Every manual destroy gets its own group and is never replaced;
# a queued create can only be replaced by a newer create, a sweep by a newer sweep.
# Concurrent stack mutations are serialized by the state backend's stack lock.
concurrency:
  group: >-
    registry-preview-${{ github.event_name == 'schedule' && 'ttl-sweep' ||
    (inputs.action == 'destroy' && format('destroy-{0}', github.run_id) || 'create') }}
  cancel-in-progress: false

env:
  STACK: preview
  REGION: us-central1
  REPOSITORY: registry
  IMAGE_NAME: hosted
  PROGRAM_DIR: deploy/registry
  # Lock the stack in the self-managed backend so overlapping runs fail instead
  # of racing.
  PULUMI_SELF_MANAGED_STATE_LOCKING: "1"

jobs:
  offline-checks:
    name: Offline IaC checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement deploy/registry/requirements.txt
      - run: python -m unittest discover -s deploy/registry/tests -v
      - run: python3 scripts/registry/check.py iac --preview

  plan:
    name: Plan preview (target-stack diff)
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'create'
    needs: offline-checks
    runs-on: ubuntu-latest
    environment: registry-preview
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      # Outranks Pulumi.yaml and any stored login: state is always the shared bucket.
      PULUMI_BACKEND_URL: gs://${{ secrets.PULUMI_STATE_BUCKET }}
    # Never export a value derived from a secret: GitHub silently drops such job
    # outputs. The origin (built from GIST_PREVIEW_BASE_DOMAIN) and the image
    # reference (built from GCP_PREVIEW_PROJECT) are recomputed in each job from
    # these secret-free parts.
    outputs:
      run_id: ${{ steps.meta.outputs.run_id }}
      expires_at: ${{ steps.meta.outputs.expires_at }}
      image_digest: ${{ steps.image.outputs.image_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_PREVIEW_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: pulumi/actions@v6
        with:
          pulumi-version: 3.x
      - run: python -m pip install --requirement deploy/registry/requirements.txt
      - name: Derive run id, origin and expiry
        id: meta
        env:
          PREVIEW_DOMAIN: ${{ secrets.GIST_PREVIEW_BASE_DOMAIN }}
          TTL_HOURS: ${{ inputs.ttl_hours }}
        run: |
          test -n "$PREVIEW_DOMAIN"
          run_id="r${GITHUB_RUN_NUMBER}"
          run_id="${run_id:0:12}"
          expires_at="$(python3 "$PROGRAM_DIR/preview.py" expiry "$TTL_HOURS")"
          {
            echo "run_id=$run_id"
            echo "expires_at=$expires_at"
          } >> "$GITHUB_OUTPUT"
          echo "ORIGIN=https://preview-${run_id}.${PREVIEW_DOMAIN}" >> "$GITHUB_ENV"
      - name: Build immutable image with Podman
        id: image
        env:
          GCP_PROJECT: ${{ secrets.GCP_PREVIEW_PROJECT }}
        run: |
          base="${REGION}-docker.pkg.dev/${GCP_PROJECT}/${REPOSITORY}/${IMAGE_NAME}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          podman build --file deploy/registry/Containerfile --tag "${base}:preview-${GITHUB_SHA}" .
          podman push --digestfile "$RUNNER_TEMP/image-digest" "${base}:preview-${GITHUB_SHA}"
          image_digest="$(cat "$RUNNER_TEMP/image-digest")"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image_digest=${image_digest}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_REF=${base}@${image_digest}" >> "$GITHUB_ENV"
      - name: Configure the preview stack
        env:
          PULUMI_STATE_BUCKET: ${{ secrets.PULUMI_STATE_BUCKET }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_PREVIEW_CONFIG_PASSPHRASE }}
          GCP_PROJECT: ${{ secrets.GCP_PREVIEW_PROJECT }}
          PRODUCTION_ORIGIN: ${{ secrets.GIST_PUBLIC_ORIGIN }}
          DNS_ZONE: ${{ secrets.GIST_PREVIEW_DNS_ZONE }}
          DNS_PROJECT: ${{ secrets.GIST_PREVIEW_DNS_PROJECT }}
          REDIRECT_URIS: ${{ secrets.GIST_PREVIEW_OAUTH_REDIRECT_URIS }}
          RUN_ID: ${{ steps.meta.outputs.run_id }}
          EXPIRES_AT: ${{ steps.meta.outputs.expires_at }}
          OWNER: ${{ github.actor }}
        run: bash deploy/registry/preview-configure.sh
      - name: Target-stack preview (review artifact)
        env:
          PULUMI_STATE_BUCKET: ${{ secrets.PULUMI_STATE_BUCKET }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_PREVIEW_CONFIG_PASSPHRASE }}
        run: |
          pulumi login "$PULUMI_BACKEND_URL"
          pulumi preview --stack "$STACK" --cwd "$PROGRAM_DIR" --diff --non-interactive | tee preview-diff.txt
      - uses: actions/upload-artifact@v4
        with:
          name: registry-preview-diff-${{ github.run_id }}
          path: preview-diff.txt
          if-no-files-found: error

  create:
    name: Create and deploy preview
    needs: plan
    runs-on: ubuntu-latest
    # Required reviewers on this environment approve the plan job's diff before apply.
    environment: registry-preview-apply
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      # Outranks Pulumi.yaml and any stored login: state is always the shared bucket.
      PULUMI_BACKEND_URL: gs://${{ secrets.PULUMI_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_PREVIEW_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: pulumi/actions@v6
        with:
          pulumi-version: 3.x
      - run: python -m pip install --requirement deploy/registry/requirements.txt
      - name: Recompute origin and image reference
        env:
          PREVIEW_DOMAIN: ${{ secrets.GIST_PREVIEW_BASE_DOMAIN }}
          GCP_PROJECT: ${{ secrets.GCP_PREVIEW_PROJECT }}
          RUN_ID: ${{ needs.plan.outputs.run_id }}
          IMAGE_DIGEST: ${{ needs.plan.outputs.image_digest }}
        run: |
          test -n "$PREVIEW_DOMAIN" && test -n "$GCP_PROJECT"
          [[ "$RUN_ID" =~ ^r[0-9]{1,11}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "ORIGIN=https://preview-${RUN_ID}.${PREVIEW_DOMAIN}"
            echo "IMAGE_REF=${REGION}-docker.pkg.dev/${GCP_PROJECT}/${REPOSITORY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
          } >> "$GITHUB_ENV"
      - name: Record owner and expiry before any resource exists
        env:
          PRODUCTION_ORIGIN: ${{ secrets.GIST_PUBLIC_ORIGIN }}
          RUN_ID: ${{ needs.plan.outputs.run_id }}
          EXPIRES_AT: ${{ needs.plan.outputs.expires_at }}
          OWNER: ${{ github.actor }}
        run: |
          mkdir -p evidence
          config_hash="$(sha256sum "$PROGRAM_DIR/__main__.py" "$PROGRAM_DIR/preview.py" "$PROGRAM_DIR/Pulumi.yaml" | sha256sum | cut -d' ' -f1)"
          jq -n --arg run_id "$RUN_ID" --arg owner "$OWNER" --arg expires_at "$EXPIRES_AT" \
            --arg origin "$ORIGIN" --arg production_origin "$PRODUCTION_ORIGIN" --arg commit "$GITHUB_SHA" \
            --arg config_hash "$config_hash" \
            '{stack:"preview", run_id:$run_id, owner:$owner, created_at:(now|todateiso8601), expires_at:$expires_at,
              origin:$origin, audience:$origin, protected_resource_metadata_url:($origin + "/.well-known/oauth-protected-resource"),
              production_origin:$production_origin, commit:$commit, config_hash:$config_hash, status:"created"}' \
            > evidence/preview-manifest.json
          python3 "$PROGRAM_DIR/preview.py" validate-manifest evidence/preview-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: registry-preview-manifest-${{ github.run_id }}
          path: evidence/preview-manifest.json
          if-no-files-found: error
      - name: Re-apply reviewed configuration
        env:
          PULUMI_STATE_BUCKET: ${{ secrets.PULUMI_STATE_BUCKET }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_PREVIEW_CONFIG_PASSPHRASE }}
          GCP_PROJECT: ${{ secrets.GCP_PREVIEW_PROJECT }}
          PRODUCTION_ORIGIN: ${{ secrets.GIST_PUBLIC_ORIGIN }}
          DNS_ZONE: ${{ secrets.GIST_PREVIEW_DNS_ZONE }}
          DNS_PROJECT: ${{ secrets.GIST_PREVIEW_DNS_PROJECT }}
          REDIRECT_URIS: ${{ secrets.GIST_PREVIEW_OAUTH_REDIRECT_URIS }}
          RUN_ID: ${{ needs.plan.outputs.run_id }}
          EXPIRES_AT: ${{ needs.plan.outputs.expires_at }}
          OWNER: ${{ github.actor }}
        run: bash deploy/registry/preview-configure.sh
      - name: Apply
        env:
          PULUMI_STATE_BUCKET: ${{ secrets.PULUMI_STATE_BUCKET }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_PREVIEW_CONFIG_PASSPHRASE }}
        run: |
          pulumi login "$PULUMI_BACKEND_URL"
          pulumi up --stack "$STACK" --cwd "$PROGRAM_DIR" --yes --non-interactive
      - name: Run database migrations
        env:
          PULUMI_STATE_BUCKET: ${{ secrets.PULUMI_STATE_BUCKET }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_PREVIEW_CONFIG_PASSPHRASE }}
          GCP_PROJECT: ${{ secrets.GCP_PREVIEW_PROJECT }}
        run: |
          job="$(pulumi stack output migration_job_name --stack "$STACK" --cwd "$PROGRAM_DIR")"
          gcloud run jobs execute "$job" --project "$GCP_PROJECT" --region "$REGION" --wait

  test:
    name: Test preview ingress and OAuth resource
    needs: [plan, create]
    runs-on: ubuntu-latest
    # Read-only probe: no cloud credentials, so no id-token. The environment
    # only supplies the base domain needed to recompute the origin.
    environment: registry-preview
    steps:
      - uses: actions/checkout@v4
      - name: Recompute origin
        env:
          PREVIEW_DOMAIN: ${{ secrets.GIST_PREVIEW_BASE_DOMAIN }}
          RUN_ID: ${{ needs.plan.outputs.run_id }}
        run: |
          test -n "$PREVIEW_DOMAIN"
          [[ "$RUN_ID" =~ ^r[0-9]{1,11}$ ]]
          echo "ORIGIN=https://preview-${RUN_ID}.${PREVIEW_DOMAIN}" >> "$GITHUB_ENV"
      - name: Wait for managed TLS and probe the application
        env:
          REQUIRE_PRM: ${{ inputs.require_protected_resource_metadata }}
        run: bash deploy/registry/preview-probe.sh

  destroy:
    name: Destroy preview
    # Runs after success, failure or cancellation of a create run, and on manual destroy.
    needs: [plan, create, test]
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      (inputs.action == 'destroy' || (needs.plan.result != 'skipped' &&
       (inputs.keep_after_test == false || needs.test.result != 'success')))
    runs-on: ubuntu-latest
    environment: registry-preview-destroy
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      # Outranks Pulumi.yaml and any stored login: state is always the shared bucket.
      PULUMI_BACKEND_URL: gs://${{ secrets.PULUMI_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_PREVIEW_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: pulumi/actions@v6
        with:
          pulumi-version: 3.x
      - run: python -m pip install --requirement deploy/registry/requirements.txt
      - name: Destroy (fail-closed)
        env:
          PULUMI_STATE_BUCKET: ${{ secrets.PULUMI_STATE_BUCKET }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_PREVIEW_CONFIG_PASSPHRASE }}
          REASON: ${{ inputs.action == 'destroy' && 'manual' || 'end-of-run' }}
          # This run created the stack, so a missing stack is a failure, not a no-op.
          EXPECT_STACK: ${{ needs.create.result != 'skipped' && inputs.action == 'create' }}
        run: bash deploy/registry/preview-destroy.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-preview-teardown-${{ github.run_id }}
          path: evidence/
          # No file means the stack held no resources, so nothing was destroyed.
          if-no-files-found: warn

  ttl-sweep:
    name: TTL sweeper
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    environment: registry-preview-destroy
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      # Outranks Pulumi.yaml and any stored login: state is always the shared bucket.
      PULUMI_BACKEND_URL: gs://${{ secrets.PULUMI_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_PREVIEW_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: pulumi/actions@v6
        with:
          pulumi-version: 3.x
      - run: python -m pip install --requirement deploy/registry/requirements.txt
      - name: Destroy when expired
        env:
          PULUMI_STATE_BUCKET: ${{ secrets.PULUMI_STATE_BUCKET }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_PREVIEW_CONFIG_PASSPHRASE }}
          REASON: ttl-expired
          ONLY_IF_EXPIRED: "true"
        run: bash deploy/registry/preview-destroy.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-preview-ttl-${{ github.run_id }}
          path: evidence/
          if-no-files-found: ignore
