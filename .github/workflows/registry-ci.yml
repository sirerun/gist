name: Registry CI

on:
  pull_request:
    paths: ["hosted/**", "deploy/registry/**", ".github/workflows/registry-*.yml"]
  push:
    branches: [main]
    paths: ["hosted/**", "deploy/registry/**", ".github/workflows/registry-*.yml"]

permissions:
  contents: read

jobs:
  root-module:
    name: Root Go module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: GOWORK=off go test ./...
      - run: GOWORK=off go vet ./...

  hosted-module:
    name: Hosted Go module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: hosted/go.mod
      - working-directory: hosted
        run: GOWORK=off go test ./...
      - working-directory: hosted
        run: GOWORK=off go vet ./...

  infrastructure:
    name: IaC static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement deploy/registry/requirements.txt
      - run: python -m py_compile deploy/registry/__main__.py
      - run: |
          python - <<'PY'
          import pathlib, yaml
          for path in [pathlib.Path("deploy/registry/Pulumi.yaml"), pathlib.Path("deploy/registry/config.example.yaml")]:
              with path.open(encoding="utf-8") as stream:
                  yaml.safe_load(stream)
          PY
      - run: python3 scripts/registry/check.py iac deploy/registry/iac-evidence.json
      - run: python -m py_compile deploy/registry/preview.py
      - name: Preview IaC unit tests (Pulumi mocks, no login or cloud access)
        run: python -m unittest discover -s deploy/registry/tests -v
      - run: python3 scripts/registry/check.py iac --preview
      - run: for script in deploy/registry/preview-*.sh; do bash -n "$script"; done
      - run: podman build --file deploy/registry/Containerfile --tag gist-registry:ci .

