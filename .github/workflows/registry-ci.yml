name: Registry CI

on:
  pull_request:
    paths: ["catalog/**", "internal/cataloglexical/**", "go.mod", "go.sum", "hosted/**", "contracts/registry/**", "scripts/registry/**", ".github/workflows/registry-*.yml"]
  push:
    branches: [main]
    paths: ["catalog/**", "internal/cataloglexical/**", "go.mod", "go.sum", "hosted/**", "contracts/registry/**", "scripts/registry/**", ".github/workflows/registry-*.yml"]

permissions:
  contents: read

jobs:
  root-module:
    name: Root Go module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: GOWORK=off go test ./...
      - run: GOWORK=off go vet ./...

  hosted-module:
    name: Hosted Go module
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gist_test
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gist_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GIST_DATABASE_URL: postgres://gist_test:fixture_only@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: hosted/go.mod
      - working-directory: hosted
        run: GOWORK=off go test ./...
      - working-directory: hosted
        run: GOWORK=off go vet ./...

  registry-checks:
    name: Registry contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/registry/check.py contracts --freeze-check
      - run: python -m unittest discover -s scripts/registry -p "*_test.py" -v
