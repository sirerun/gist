name: Registry CI

on:
  pull_request:
    paths: ["hosted/**", "contracts/registry/**", "scripts/registry/**", ".github/workflows/registry-*.yml"]
  push:
    branches: [main]
    paths: ["hosted/**", "contracts/registry/**", "scripts/registry/**", ".github/workflows/registry-*.yml"]

permissions:
  contents: read

jobs:
  root-module:
    name: Root Go module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: GOWORK=off go test ./...
      - run: GOWORK=off go vet ./...

  hosted-module:
    name: Hosted Go module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: hosted/go.mod
      - working-directory: hosted
        run: GOWORK=off go test ./...
      - working-directory: hosted
        run: GOWORK=off go vet ./...

  registry-checks:
    name: Registry contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/registry/check.py contracts --freeze-check
      - run: python -m unittest discover -s scripts/registry -p "*_test.py" -v
