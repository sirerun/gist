version: "2"
linters:
  default: standard
  settings:
    errcheck:
      check-type-assertions: true
  exclusions:
    generated: lax
    presets: []
    rules:
      - linters:
          - errcheck
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
