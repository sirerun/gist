openapi: 3.1.0
info:
  title: Gist Publication Transport
  version: 2.0.0
  description: Additive publication and exact readback transport. No provider execution
    authority is implied.
servers:
- url: https://gist.example.com
security:
- bearerAuth: []
paths:
  /v2/publish/skill:
    post:
      operationId: publishSkillV2
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: skill.publish.schema.json
      responses:
        '201':
          $ref: '#/components/responses/Published'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '200':
          $ref: '#/components/responses/Published'
        '500':
          $ref: '#/components/responses/Error'
      x-required-scopes:
      - catalog:publish
      description: Current active maintainer plus catalog:publish; tenant and namespace
        supplied by authenticated policy.
  /v2/publish/capability:
    post:
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '201':
          $ref: '#/components/responses/Published'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '200':
          $ref: '#/components/responses/Published'
        '500':
          $ref: '#/components/responses/Error'
      operationId: publishCapabilityV2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: capability.publish.schema.json
      x-required-scopes:
      - catalog:publish
      description: Current active maintainer plus catalog:publish; tenant and namespace
        supplied by authenticated policy.
  /v2/publish/tool:
