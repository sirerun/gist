          $ref: '#/components/responses/Published'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '200':
          $ref: '#/components/responses/Published'
        '500':
          $ref: '#/components/responses/Error'
      operationId: publishToolV2
      requestBody:
        required: true
        content:
          application/json:
