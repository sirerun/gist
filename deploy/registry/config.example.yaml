# Non-secret example stack configuration. Replace project, origin, state, and image.
config:
  gist-registry:project: example-registry-project
  gist-registry:region: us-central1
  gist-registry:publicOrigin: https://registry.example.invalid
  gist-registry:resourceAudience: https://registry.example.invalid
  gist-registry:containerImage: us-central1-docker.pkg.dev/example-registry-project/registry/hosted@sha256:REPLACE_WITH_IMAGE_DIGEST
  gist-registry:githubRepository: sirerun/gist
  gist-registry:stateBucket: gs://REPLACE_WITH_PRIVATE_PULUMI_STATE_BUCKET
  gist-registry:databasePasswordSecret: gist-registry-database-password
  gist-registry:issuerSecret: gist-registry-oauth-issuer
  gist-registry:signingKeySecret: gist-registry-workload-signing-key
  gist-registry:limits:
    maxPackageBytes: 10485760
    maxExpandedPackageBytes: 52428800
    maxRequestBytes: 1048576
    maxResponseBytes: 2097152
    maxCatalogEntries: 100000
    maxConcurrentRequests: 80
    maxDiscoveryResults: 50
    requestTimeoutSeconds: 30
    targetAvailabilityPercent: 99.5
    p95LatencyMilliseconds: 750
    errorRatePercent: 1.0
    backupRetentionDays: 14
    previewTtlHours: 24
