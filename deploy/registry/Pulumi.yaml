name: gist-registry
runtime:
  name: python
  options:
    virtualenv: venv
description: IaC for the hosted Gist registry deployment surface
backend:
  url: file://.pulumi-state
config:
  gist-registry:project:
    description: Cloud project hosting this isolated registry stack
  gist-registry:region:
    default: us-central1
  gist-registry:publicOrigin:
    description: Exact HTTPS origin with no path or trailing slash
  gist-registry:resourceAudience:
    description: Exact audience; defaults to publicOrigin in the service
  gist-registry:containerImage:
    description: Immutable container reference, preferably by digest
  gist-registry:githubRepository:
    description: owner/repository allowed to deploy through GitHub OIDC
  gist-registry:stateBucket:
    description: Pre-created private bucket used as the Pulumi state backend
  gist-registry:limits:
    description: JSON object containing bounded service limits and SLOs
  gist-registry:deploymentMode:
    description: "target (default, long-lived) or preview (short-lived OAuth preview; stack must be named preview)"
  gist-registry:productionOrigin:
    description: Production origin the preview must differ from (preview mode only)
  gist-registry:oauthRedirectUris:
    description: JSON array of exact HTTPS OAuth redirect URIs for this deployment
  gist-registry:previewRunId:
    description: Unique 1-12 character run id; the preview origin host must start with preview-<runId>.
  gist-registry:previewOwner:
    description: Person or automation accountable for the preview run
  gist-registry:previewExpiresAt:
    description: RFC 3339 UTC expiry, at most limits.previewTtlHours (<= 24) away; the TTL sweeper destroys after it
  gist-registry:previewDnsZone:
    description: Existing Cloud DNS managed zone that receives the preview A record
  gist-registry:previewDnsProject:
    description: Project that owns previewDnsZone; defaults to project
